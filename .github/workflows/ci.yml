name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every numeric check compares against quality-baseline.json and fails on regression.
# The baseline is rewritten by the update-baseline job after a green run on main.

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    outputs:
      violations: ${{ steps.run.outputs.violations }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: .github/scripts/baseline.sh
      - id: run
        shell: bash
        run: |
          # ESLint exits 1 when it finds violations; that is a metric, not a crash.
          npx eslint . -f json > /tmp/eslint.json || true
          violations=$(jq '[.[] | .errorCount + .warningCount] | add // 0' /tmp/eslint.json 2>/dev/null || true)
          npx eslint . --max-warnings=0 || true
          .github/scripts/gate.sh violations "$violations" lintViolations lower

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: run
        shell: bash
        run: |
          if npx tsc --noEmit; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.run.outputs.coverage }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: .github/scripts/baseline.sh
      - id: run
        shell: bash
        run: |
          npm run test:cov
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || true)
          .github/scripts/gate.sh coverage "$coverage" coverage higher

  secrets:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: run
        shell: bash
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          if ./gitleaks detect --source . -v --config .gitleaks.toml; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            exit 1
          fi

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    outputs:
      high: ${{ steps.run.outputs.high }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: .github/scripts/baseline.sh
      - id: run
        shell: bash
        run: |
          # npm audit exits 1 when it finds anything; that is a metric, not a crash.
          npm audit --json > audit-output.json || true
          high=$(jq '(.metadata.vulnerabilities.high // 0) + (.metadata.vulnerabilities.critical // 0)' audit-output.json 2>/dev/null || true)
          npm audit --audit-level=high || true
          .github/scripts/gate.sh high "$high" auditHigh lower

  duplication:
    name: Code Duplication (jscpd)
    runs-on: ubuntu-latest
    outputs:
      pct: ${{ steps.run.outputs.pct }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: .github/scripts/baseline.sh
      - id: run
        shell: bash
        run: |
          mkdir -p report
          # jscpd exits 1 above its own threshold; that is a metric, not a crash.
          npx jscpd src/ --reporters=json,console --output=report/ || true
          pct=$(jq '.statistics.total.percentage // 0' report/jscpd-report.json 2>/dev/null || true)
          .github/scripts/gate.sh pct "$pct" duplication lower

  security:
    name: Security Scan (semgrep)
    runs-on: ubuntu-latest
    outputs:
      errors: ${{ steps.run.outputs.errors }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install semgrep
      - run: .github/scripts/baseline.sh
      - id: run
        shell: bash
        run: |
          # A semgrep crash (install failure, bad config) must not read as zero findings.
          semgrep scan --config=p/security-audit src/ --json > semgrep-results.json
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json 2>/dev/null || true)
          jq -r '.results[] | select(.extra.severity == "ERROR") | "\(.path):\(.start.line) — \(.extra.message)"' semgrep-results.json || true
          .github/scripts/gate.sh errors "$errors" securityErrors lower

  unused:
    name: Unused Code (knip)
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.run.outputs.count }}
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: .github/scripts/baseline.sh
      - id: run
        shell: bash
        run: |
          # knip exits 1 when it finds issues; that is a metric, not a crash.
          npx knip --reporter=json > knip-output.json || true
          count=$(jq '
            [.issues[] |
              (.files | length) + (.exports | length) + (.types | length) +
              (.dependencies | length) + (.devDependencies | length) +
              (.unlisted | length) + (.unresolved | length) + (.duplicates | length) +
              (.enumMembers | length) + (.namespaceMembers | length) + (.binaries | length)
            ] | add // 0
          ' knip-output.json 2>/dev/null || true)
          npx knip || true
          .github/scripts/gate.sh count "$count" unusedExports lower

  integration:
    name: Integration (Neon)
    runs-on: ubuntu-latest
    concurrency:
      group: integration-neon
      cancel-in-progress: false
    outputs:
      status: ${{ steps.run.outputs.status || steps.skip.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: db
        shell: bash
        env:
          URL: ${{ secrets.TEST_DATABASE_URL }}
        run: echo "present=$([ -n "$URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Check database connectivity
        if: steps.db.outputs.present == 'true'
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
        shell: bash
        run: |
          # drizzle-kit swallows connection errors behind its spinner; surface them here.
          node --input-type=module -e '
            import { neon } from "@neondatabase/serverless";
            for (const name of ["TEST_DATABASE_URL", "DATABASE_URL_UNPOOLED"]) {
              const url = process.env[name] ?? "";
              const shape = url.replace(/:[^:@/]+@/, ":***@");
              if (!/^postgres(ql)?:\/\//.test(url)) { console.error(`::error::${name} does not look like a postgres URL (starts with ${JSON.stringify(url.slice(0, 12))}); check for stray quotes`); process.exit(1); }
              try { const [r] = await neon(url)`select current_database() as db, version() as v`; console.log(`${name}: ok (${shape}) ${r.db}`); }
              catch (e) { console.error(`::error::${name} (${shape}): ${e.message}`); process.exit(1); }
            }
          '
      - name: Migrate the CI branch
        if: steps.db.outputs.present == 'true'
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
        run: npx drizzle-kit migrate
      - name: Run integration tests
        id: run
        if: steps.db.outputs.present == 'true'
        shell: bash
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          npm run test:integration
          echo "status=pass" >> "$GITHUB_OUTPUT"
      - name: No secret configured
        id: skip
        if: steps.db.outputs.present == 'false'
        shell: bash
        run: |
          echo "::warning::TEST_DATABASE_URL secret not set; integration tests skipped"
          echo "status=skipped" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [integration]
    concurrency:
      group: integration-neon
      cancel-in-progress: false
    outputs:
      status: ${{ steps.run.outputs.status || steps.skip.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: secrets
        shell: bash
        env:
          DB: ${{ secrets.TEST_DATABASE_URL }}
          DB_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
          AWS: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLERK: ${{ secrets.CLERK_SECRET_KEY }}
          PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$DB" ] && [ -n "$DB_UNPOOLED" ] && [ -n "$AWS" ] && [ -n "$AWS_SECRET" ] && \
             [ -n "$AWS_ENDPOINT" ] && [ -n "$AWS_REGION" ] && [ -n "$CLERK" ] && [ -n "$PK" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium
        if: steps.secrets.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        id: run
        if: steps.secrets.outputs.present == 'true'
        shell: bash
        env:
          CI: "1"
          # The test branch, already migrated by the integration job.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
        run: |
          npm run test:e2e
          echo "status=pass" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.secrets.outputs.present == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Secrets not configured
        id: skip
        if: steps.secrets.outputs.present == 'false'
        shell: bash
        run: |
          echo "::warning::E2E skipped: needs TEST_DATABASE_URL, TEST_DATABASE_URL_UNPOOLED, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, AWS_REGION, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY"
          echo "status=skipped" >> "$GITHUB_OUTPUT"

  report:
    name: Quality Report
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, secrets, audit, duplication, security, unused, integration, e2e]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/baseline.sh
      - uses: actions/github-script@v7
        env:
          LINT_STATUS: ${{ needs.lint.outputs.status }}
          LINT_VIOLATIONS: ${{ needs.lint.outputs.violations }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_STATUS: ${{ needs.test.outputs.status }}
          TEST_COVERAGE: ${{ needs.test.outputs.coverage }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          AUDIT_STATUS: ${{ needs.audit.outputs.status }}
          AUDIT_HIGH: ${{ needs.audit.outputs.high }}
          DUPLICATION_STATUS: ${{ needs.duplication.outputs.status }}
          DUPLICATION_PCT: ${{ needs.duplication.outputs.pct }}
          SECURITY_STATUS: ${{ needs.security.outputs.status }}
          SECURITY_ERRORS: ${{ needs.security.outputs.errors }}
          UNUSED_STATUS: ${{ needs.unused.outputs.status }}
          UNUSED_COUNT: ${{ needs.unused.outputs.count }}
          INTEGRATION_STATUS: ${{ needs.integration.outputs.status }}
          E2E_STATUS: ${{ needs.e2e.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const baseline = JSON.parse(fs.readFileSync(process.env.BASELINE_FILE, 'utf8'));

            const icon = s => {
              if (s === 'pass' || s === 'success') return '✅';
              if (s === 'skipped' || s === 'cancelled') return '⚠️';
              return '❌';
            };

            const fmt = (val, unit) => {
              if (val == null || val === '' || val === 'undefined') return '—';
              return unit === '%' ? `${parseFloat(val).toFixed(1)}%` : `${val} ${unit}`.trim();
            };

            const delta = (prev, curr, lowerIsBetter) => {
              if (prev == null || curr == null || curr === '' || curr === 'undefined') return '—';
              const d = parseFloat(curr) - parseFloat(prev);
              if (Math.abs(d) < 0.05) return '—';
              const improving = lowerIsBetter ? d < 0 : d > 0;
              const sign = d > 0 ? '+' : '';
              return `${sign}${d.toFixed(1)} ${improving ? '✅' : '❌'}`;
            };

            const checks = [
              { name: 'lint',        status: process.env.LINT_STATUS,       prev: baseline.lintViolations, curr: process.env.LINT_VIOLATIONS,   unit: 'violations', lower: true  },
              { name: 'typecheck',   status: process.env.TYPECHECK_RESULT === 'success' ? 'pass' : 'fail', prev: null, curr: null, unit: null },
              { name: 'test',        status: process.env.TEST_STATUS,        prev: baseline.coverage,       curr: process.env.TEST_COVERAGE,     unit: '%',          lower: false },
              { name: 'secrets',     status: process.env.SECRETS_RESULT === 'success' ? 'pass' : 'fail',  prev: null, curr: null, unit: null },
              { name: 'audit',       status: process.env.AUDIT_STATUS,       prev: baseline.auditHigh,      curr: process.env.AUDIT_HIGH,        unit: 'high/crit',  lower: true  },
              { name: 'duplication', status: process.env.DUPLICATION_STATUS, prev: baseline.duplication,    curr: process.env.DUPLICATION_PCT,   unit: '%',          lower: true  },
              { name: 'security',    status: process.env.SECURITY_STATUS,    prev: baseline.securityErrors, curr: process.env.SECURITY_ERRORS,   unit: 'errors',     lower: true  },
              { name: 'unused',      status: process.env.UNUSED_STATUS,      prev: baseline.unusedExports,  curr: process.env.UNUSED_COUNT,      unit: 'issues',     lower: true  },
              { name: 'integration', status: process.env.INTEGRATION_STATUS === 'pass' ? 'pass' : process.env.INTEGRATION_STATUS === 'skipped' ? 'skipped' : 'fail', prev: null, curr: null, unit: null },
              { name: 'e2e',         status: process.env.E2E_STATUS === 'pass' ? 'pass' : process.env.E2E_STATUS === 'skipped' ? 'skipped' : 'fail', prev: null, curr: null, unit: null },
            ];

            const rows = checks.map(c =>
              `| ${c.name} | ${icon(c.status)} | ${fmt(c.prev, c.unit)} | ${fmt(c.curr, c.unit)} | ${c.prev != null ? delta(c.prev, c.curr, c.lower) : '—'} |`
            );

            const body = [
              '## CI Quality Gate',
              '',
              '| Check | Status | Previous | Current | Delta |',
              '|---|---|---|---|---|',
              ...rows,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith('## CI Quality Gate'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  update-baseline:
    name: Update Quality Baseline
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, secrets, audit, duplication, security, unused, integration, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.secrets.result == 'success' &&
      needs.audit.result == 'success' &&
      needs.duplication.result == 'success' &&
      needs.security.result == 'success' &&
      needs.unused.result == 'success' &&
      needs.integration.outputs.status == 'pass' &&
      needs.e2e.outputs.status == 'pass'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          COVERAGE: ${{ needs.test.outputs.coverage }}
          DUPLICATION: ${{ needs.duplication.outputs.pct }}
          AUDIT_HIGH: ${{ needs.audit.outputs.high }}
          SECURITY_ERRORS: ${{ needs.security.outputs.errors }}
          UNUSED_COUNT: ${{ needs.unused.outputs.count }}
          LINT_VIOLATIONS: ${{ needs.lint.outputs.violations }}
        shell: bash
        run: |
          node -e "
            const data = {
              coverage: parseFloat(process.env.COVERAGE) || 0,
              duplication: parseFloat(process.env.DUPLICATION) || 0,
              auditHigh: parseInt(process.env.AUDIT_HIGH) || 0,
              securityErrors: parseInt(process.env.SECURITY_ERRORS) || 0,
              unusedExports: parseInt(process.env.UNUSED_COUNT) || 0,
              lintViolations: parseInt(process.env.LINT_VIOLATIONS) || 0,
            };
            require('fs').writeFileSync('quality-baseline.json', JSON.stringify(data, null, 2) + '\n');
          "
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quality-baseline.json
          git diff --staged --quiet || git commit -m "chore: update quality baseline [skip ci]"
          git push
